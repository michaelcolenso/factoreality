name: Run pipeline

# The remote execution plane. Trigger this from the GitHub mobile app (or the
# web UI) to run the pipeline without a machine of your own being awake: the
# repo is the file stack, the runner is the box, and the job summary reports
# every gate score where you can read it on a phone.
on:
  workflow_dispatch:
    inputs:
      brief:
        description: "Product brief — leave empty to run against the committed spec.md"
        required: false
        type: string
      regenerate_spec:
        description: "Overwrite spec.md from the brief"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Validate spec and plan without writing output files"
        required: false
        default: false
        type: boolean
      open_pr:
        description: "Open a pull request with the generated product"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The pipeline has no runtime dependencies; this is here so the workflow
      # keeps working if that ever changes.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Inputs are passed through env, never interpolated into the script body:
      # `${{ inputs.brief }}` inline would let brief text break out of the shell.
      - name: Write brief
        if: inputs.brief != ''
        env:
          BRIEF: ${{ inputs.brief }}
        run: printf '%s\n' "$BRIEF" > product-brief.md

      - name: Run pipeline
        id: pipeline
        continue-on-error: true
        env:
          BRIEF: ${{ inputs.brief }}
          REGENERATE_SPEC: ${{ inputs.regenerate_spec }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(.)
          [ -n "$BRIEF" ] && ARGS+=(--brief-file product-brief.md)
          [ "$REGENERATE_SPEC" = "true" ] && ARGS+=(--regenerate-spec)
          [ "$DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          python orchestrator.py "${ARGS[@]}"

      - name: Summarize gates
        if: always()
        run: python .github/scripts/run_summary.py . >> "$GITHUB_STEP_SUMMARY"

      # output/ and friends are gitignored, so they travel as run artifacts
      # rather than commits. This keeps a halted run from polluting the repo.
      - name: Upload deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            output/
            draft/
            outline/
            research/
            qa-reviews/
            status.md
            status.json
            plan.md
          if-no-files-found: warn
          retention-days: 30

      - name: Open pull request with the product
        if: inputs.open_pr && steps.pipeline.outcome == 'success' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="pipeline-run/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          # -f because the generated directories are gitignored by design.
          git add -f output spec.md
          [ -f product-brief.md ] && git add -f product-brief.md
          git commit -m "Pipeline output from run $GITHUB_RUN_ID"
          git push -u origin "$BRANCH"
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "Pipeline output: $BRANCH" \
            --body "Generated by the \`Run pipeline\` workflow. Gate scores are in the [run summary]($RUN_URL)."

      - name: Fail if the pipeline halted
        if: steps.pipeline.outcome != 'success'
        run: |
          echo "Pipeline halted — see the job summary for the failing gate."
          exit 1
